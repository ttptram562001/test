name: CD - Deploy on Merge to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - develop 

env:
  PYTHON_VERSION: '3.10'
  PACKAGE_NAME: '.'


jobs:
  deploy:
    if: github.event.pull_request.merged == true   # chỉ chạy khi merge, không chạy khi chỉ closed
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: 'Deploy to Azure Functions'
      id: deploy-to-function
      uses: Azure/functions-action@v1
      with:
        # Tên Function App của bạn trên Azure
        app-name: 'oktatest-func'
        
        # Trỏ đến thư mục gốc của repo để đóng gói.
        package: '.'
        
        # "Chìa khóa" để đăng nhập vào Azure
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        
        # Cấu hình đặc biệt cho gói Flex Consumption
        sku: flexconsumption
        
        # Yêu cầu Azure tự build ứng dụng sau khi nhận code
        remote-build: true
